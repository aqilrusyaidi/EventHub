<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EventHub | Customer Portal</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark bg-primary py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        🎟 EventHub
      </a>
      <span class="text-white">Customer Portal</span>
    </div>
  </nav>

  <!-- Welcome Section -->
  <header class="bg-white text-center py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">
        Discover Amazing Events
      </h1>

      <p class="lead text-muted">
        Find exciting events and book your tickets easily.
      </p>

      <a href="#events" class="btn btn-primary btn-lg">
        Explore Events
      </a>
    </div>
  </header>

  <!-- Events Section -->
  <main class="container py-5" id="events">
    <h2 class="fw-bold mb-4">Upcoming Events</h2>

    <div class="row g-4" id="eventList">
      <div class="col-12">
        <p class="text-muted">
          Events will be displayed here soon.
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">
      &copy; 2026 EventHub. All rights reserved.
    </p>
  </footer>

<script src="script.js"></script>
</body>
</html>
