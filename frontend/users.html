<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Users</h1>
        <p class="muted" id="summary">Loading users…</p>
      </div>
      <div>
        <label for="role-filter">Show</label>
        <select id="role-filter">
          <option value="all">All roles</option>
          <option value="customer">Customers</option>
          <option value="organiser">Organisers</option>
          <option value="admin">Administrators</option>
        </select>
      </div>
    </div>

    <div id="message"></div>

    <div class="table-wrap hidden" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="num">ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
            <th><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <dialog id="user-dialog" aria-labelledby="dialog-title">
    <form class="dialog-body" id="user-form" novalidate>
      <h2 id="dialog-title">Edit user</h2>
      <div id="form-message"></div>

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" maxlength="100">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="150">
      </div>

      <div class="field">
        <label for="role">Role</label>
        <select id="role">
          <option value="customer">Customer</option>
          <option value="organiser">Organiser</option>
          <option value="admin">Administrator</option>
        </select>
        <p class="hint" id="role-hint">The role decides which pages and actions the user gets.</p>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-button">Discard</button>
        <button type="submit" class="btn" id="save-button">Save changes</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
