<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 id="page-title">Bookings</h1>
        <p class="muted" id="summary">Loading bookings…</p>
      </div>
      <div>
        <label for="status-filter">Show</label>
        <select id="status-filter">
          <option value="all">All bookings</option>
          <option value="confirmed">Confirmed only</option>
          <option value="cancelled">Cancelled only</option>
        </select>
      </div>
    </div>

    <div id="message"></div>

    <div class="table-wrap hidden" id="table-wrap">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Booking details, drawn like a ticket -->
  <dialog id="booking-dialog" aria-labelledby="receipt-title">
    <div class="receipt">
      <div class="ticket-stub">
        <span class="stub-label">Booking</span>
        <span class="stub-day" id="receipt-number"></span>
      </div>
      <div class="receipt-body">
        <h2 id="receipt-title"></h2>
        <dl class="facts" id="receipt-facts"></dl>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="close-receipt">Close</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
