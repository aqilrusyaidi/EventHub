<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage events | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Manage events</h1>
        <p class="muted" id="summary">Loading events…</p>
      </div>
      <button type="button" class="btn" id="create-button">Create event</button>
    </div>

    <div id="message"></div>

    <div class="table-wrap hidden" id="table-wrap">
      <table>
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- One form for both "create" and "edit" -->
  <dialog id="event-dialog" aria-labelledby="dialog-title">
    <form class="dialog-body" id="event-form" novalidate>
      <h2 id="dialog-title">Create event</h2>
      <div id="form-message"></div>

      <div class="field">
        <label for="event-name">Event name</label>
        <input type="text" id="event-name" maxlength="150">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description"></textarea>
        <p class="hint">Optional. Tell customers what to expect.</p>
      </div>

      <!-- Venue and ticket count can only be set when creating -->
      <div class="field" id="venue-field">
        <label for="venue">Venue</label>
        <select id="venue"></select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="event-date">Date and time</label>
          <input type="datetime-local" id="event-date">
        </div>
        <div class="field">
          <label for="ticket-price">Ticket price (RM)</label>
          <input type="number" id="ticket-price" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <div class="field" id="tickets-field">
        <label for="total-tickets">Total tickets</label>
        <input type="number" id="total-tickets" min="1" step="1" inputmode="numeric">
        <p class="hint" id="capacity-hint"></p>
      </div>

      <p class="alert alert-info hidden" id="fixed-note"></p>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-button">Discard</button>
        <button type="submit" class="btn" id="save-button">Create event</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/manage-events.js"></script>
</body>
</html>
