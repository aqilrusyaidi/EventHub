<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <h1>Create an account</h1>
      <p class="muted">A customer account lets you book tickets and manage your bookings.</p>

      <form class="panel" id="register-form" novalidate>
        <div id="message"></div>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" maxlength="100">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" maxlength="150">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" maxlength="72">
          <p class="hint">At least 8 characters.</p>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" maxlength="72">
        </div>

        <button type="submit" class="btn" id="register-button">Create account</button>
      </form>

      <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
