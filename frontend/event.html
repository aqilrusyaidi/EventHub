<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event details | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <a class="back-link" href="index.html">Back to all events</a>
    <div id="message"></div>

    <div class="detail hidden" id="detail">
      <!-- Left: what the event is -->
      <section class="panel" aria-labelledby="event-name">
        <h1 id="event-name"></h1>
        <p class="muted" id="event-description" style="margin-top: 0.75rem;"></p>
        <dl class="facts" id="event-facts"></dl>

        <!-- Weather at the venue, from the third-party API -->
        <div class="weather hidden" id="weather"></div>
      </section>

      <!-- Right: booking. The content depends on who is logged in. -->
      <section class="panel" aria-labelledby="booking-title">
        <h2 id="booking-title">Book tickets</h2>
        <div id="booking-area"></div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
