<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Upcoming events</h1>
        <p class="muted" id="event-count">Loading events…</p>
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search by event, venue or city" aria-label="Search events">
      <select id="sort" aria-label="Sort events">
        <option value="date">Soonest first</option>
        <option value="price-low">Price: low to high</option>
        <option value="price-high">Price: high to low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </div>

    <div id="message"></div>
    <ul class="ticket-list" id="event-list"></ul>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
