<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/events">Event<span>Hub</span></a>
    <nav id="nav"></nav>
  </header>

  <main id="app" class="container"></main>

  <dialog id="modal">

      <button type="button" class="icon-btn" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div id="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
