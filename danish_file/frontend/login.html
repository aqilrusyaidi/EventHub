<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <h1>Log in</h1>
      <p class="muted">Customers, organisers and administrators all log in here.</p>

      <form class="panel" id="login-form" novalidate>
        <div id="message"></div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn" id="login-button">Log in</button>
      </form>

      <p class="auth-switch">No account yet? <a href="register.html">Register as a customer</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
