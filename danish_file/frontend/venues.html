<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venues | EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Venues</h1>
        <p class="muted" id="summary">Loading venues…</p>
      </div>
      <button type="button" class="btn" id="create-button">Add venue</button>
    </div>

    <div id="message"></div>

    <div class="table-wrap hidden" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Venue</th>
            <th>Location</th>
            <th class="num">Capacity</th>
            <th class="num">Events held here</th>
            <th><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <dialog id="venue-dialog" aria-labelledby="dialog-title">
    <form class="dialog-body" id="venue-form" novalidate>
      <h2 id="dialog-title">Add venue</h2>
      <div id="form-message"></div>

      <div class="field">
        <label for="venue-name">Venue name</label>
        <input type="text" id="venue-name" maxlength="150">
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" maxlength="255">
        <p class="hint">The city or area, for example Shah Alam.</p>
      </div>

      <div class="field">
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" min="1" step="1" inputmode="numeric">
        <p class="hint">The most people the venue can hold. Events cannot sell more tickets than this.</p>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-button">Discard</button>
        <button type="submit" class="btn" id="save-button">Add venue</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/venues.js"></script>
</body>
</html>
